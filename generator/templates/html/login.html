{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso · Sistema de Horarios</title>
  <link rel="icon" href="{% static 'icono.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'loginStyle.css' %}">
</head>
<body>
  <div id="contenedor">
    <div id="central">
      <div id="login">
        <img class="logo" src="{% static 'icono.svg' %}" alt="" width="56" height="56">
        <div class="titulo">Bienvenido</div>
        <p class="subtitulo">Sistema de Horarios</p>
        {% if form.errors %}
          <p class="error">Usuario o contraseña incorrectos.</p>
        {% endif %}
        <form id="loginform" method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next|default:'' }}">
          <input type="text" name="username" placeholder="Usuario" autocomplete="username" autofocus required>
          <input type="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
          <button type="submit" title="Ingresar">Ingresar</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
